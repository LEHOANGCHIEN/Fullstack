<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/phan-11.css">
</head>
<body>

    <style>
        /* Bộ chọn con */
        main > h2 {
            color: orange;
        }

        main > aside > h2 {
            color: red;
        }

        main > aside > aside > h2 {
            color: green;
        }
        /* Bộ chọn hậu duệ */
        main h2 {
            font-size: 40px;
            font-weight: 300;
        }
    </style>

    <main>
        <h2>Nội dung 1</h2>
        <h2>Nội dung 2</h2>
        <aside>
            <h2>Nội dung 3</h2>
            <h2>Nội dung 4</h2>
            <aside>
                <h2>Nội dung 5</h2>
                <h2>Nội dung 6</h2>
            </aside>
        </aside>
    </main>
</body>
</html>
