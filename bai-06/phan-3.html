<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Playwrite+IE:wght@100..400&family=Potta+One&display=swap');

        :root {
            --color-1: #c02026;
            --color-2: #f47f20;
            --border: 12px;
            --font-1: "Be Vietnam Pro", sans-serif;
            --font-2: "Playwrite IE", cursive;
            --font-3: "Potta One", system-ui;
        }

        .title-1 {
            color: var(--color-1);
            border: 10px solid var(--color-2);
            border-radius: var(--border);
            font-family: var(--font-1);
        }

        .title-2 {
            color: var(--color-2);
            border: 10px solid var(--color-1);
            border-radius: var(--border);
            font-family: var(--font-2);
        }

        .title-3 {
            color: white;
            background-color: var(--color-1);
            border: 10px solid var(--color-2);
            border-radius: var(--border);
            font-family: var(--font-3);
        }

        .title-4 {
            color: white;
            background-color: var(--color-2);
            border: 10px solid var(--color-1);
            border-radius: var(--border);
            font-family: var(--font-2);
        }
    </style>
    
    <h2 class="title-1">Nội dung 1</h2>
    <h2 class="title-2">Nội dung 2</h2>
    <h2 class="title-3">Nội dung 3</h2>
    <h2 class="title-4">Nội dung 4</h2>

</body>
</html>
