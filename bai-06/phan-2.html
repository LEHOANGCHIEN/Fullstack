<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        .box {
            width: 200px;
            height: 200px;
        }

        .box-1 {
            background-color: orange;
            position: relative;
            z-index: 2;
        }

        .box-2 {
            background-color: green;
            margin-top: -100px;
            margin-left: 100px;
            position: relative;
            z-index: 1;
        }

        .box-3 {
            background-color: purple;
            margin-top: -100px;
            margin-left: 200px;
            position: relative;
            z-index: 0;
        }
    </style>

    <div class="box box-1"></div>  
    <div class="box box-2"></div>
    <div class="box box-3"></div>

</body>
</html>
