<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        * {
            box-sizing: border-box;
        }

        .parent {
            background: #7c4991;
            padding: 10px;
            border-radius: 5px;
            height: 400px;

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: flex-start;
            /* align-content: space-between; */
        }

        .child {
            background-color: #f7941f;
            border: 3px solid #fff;
            padding: 10px;
            /* margin: 5px; */
            font-size: 28px;
            color: #000;
            border-radius: 5px;
            text-align: center;
            width: 150px;
        }

        .child-1 {
            align-self: auto;
            order: 2k;
        }

        .child-2 {
            align-self: center;
            order: 0;
        }

        .child-3 {
            align-self: flex-end;
            order: 1;
        }

        .child-4 {
            align-self: stretch;
            order: 4;
        }

    </style>

    <div class="parent">
        <div class="child child-1">Phần tử 1</div>
        <div class="child child-2">Phần tử 2</div>
        <div class="child child-3">Phần tử 3</div>
        <div class="child child-4">Phần tử 4</div>
        <!-- <div class="child">Phần tử 5</div>
        <div class="child">Phần tử 6</div>
        <div class="child">Phần tử 7</div>
        <div class="child">Phần tử 8</div>
        <div class="child">Phần tử 9</div> -->
    </div>
</body>
</html>
