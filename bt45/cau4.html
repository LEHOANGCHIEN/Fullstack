<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 4 | Bài tập bài 4 + 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <h2>Câu 4: Pagination (Phân trang)</h2>
    <p><strong>Yêu cầu</strong>: Sử dụng HTML và CSS để dựng khối phân trang bên dưới (Dùng thẻ button).</p>
    <style>
        .button {
            background-color: #f6f6f6;
            border: 0;
            height: 45px;
            width: 45px;
            font-size: 18px;
            color: #6b7385;
            border-radius: 5px;
        }

        .button.button-3, .button:hover {
            background-color: #2F57EF;
            color: #ffffff
        }
    </style>

    <button class="button"><i class="fa-solid fa-angle-left"></i></button>
    <button class="button">1</button>
    <button class="button">2</button>
    <button class="button button-3">3</button>
    <button class="button">4</button>
    <button class="button">5</button>
    <button class="button"><i class="fa-solid fa-angle-right"></i></button>


</body>
</html>
