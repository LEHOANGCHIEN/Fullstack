<body>
    <h2>Câu 7: Table (Bảng)</h2>
    <p><strong>Yêu cầu</strong>: Sử dụng HTML và CSS để dựng bảng bên dưới (Dùng thẻ table, thead, tbody, tr, th, td).</p>
    <style>
        table {
            border-collapse: collapse;
        }

        table th {
            background-color: orange;
        }

        table th, table td {
            padding: 10px 20px;
            border: 1px solid #ddd;
        }

        table tbody tr:nth-child(2n) {
            background-color: #f6f6f6;
        }

        table tbody tr:hover {
            background-color: #ececec;
        }
    </style>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Giới tính</th>
                <th>Tuổi</th>
