<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 3 | Bài tập bài 4 + 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <h2>Câu 3: Socials (Mạng xã hội)</h2>
    <p><strong>Yêu cầu</strong>: Sử dụng HTML và CSS để dựng các nút mạng xã hội bên dưới (Dùng thẻ button).</p>
    <style>
        .button {
            background-color: #f6f6f6;
            border: 0;
            height: 48px;
            width: 48px;
            border-radius: 50%;
            font-size: 18px;
            color: #6b7385;
        }

        .button:hover {
            background-color: #2f57ef;
            border-color: #2f57ef;
            color: #ffffff;
        }
    </style>

    <button class="button facebook"><i class="fa-brands fa-facebook-f"></i></button>
    <button class="button twitter"><i class="fa-brands fa-x-twitter"></i></button>
    <button class="button instagram"><i class="fa-brands fa-instagram"></i></button>
    <button class="button tiktok"><i class="fa-brands fa-tiktok"></i></button>

</body>
</html>
