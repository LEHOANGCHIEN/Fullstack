<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 2 | Bài tập 4 + 5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <h2>Câu 2: Buttons (Nút bấm)</h2>
    <p><strong>Yêu cầu</strong>: Sử dụng HTML và CSS để dựng các nút bên dưới (Dùng thẻ button).</p>
    <style>
        .button {
            font-size: 24px;
            font-weight: 900;
            border-radius: 50%;
            width: 80px;
            height:80px;
            background-color: #2f57ef;
            color: #ffffff;
            border: 2px solid #e6e3f1;
        }    

        .button-2 {
            background-color: #ffffff;
            color: black;
        }

        .button-2:hover {
            background-color: #3956e6;
            color: #ffffff;
        }

        .button-3 {
            background-color: #7ba001;
            border-color: #7ba001;
        }

        .button-3:hover {
            background-color: #607d00;
            border-color: #607d00;
        }

    </style>
    <button class="button button-1"><i class="fa-solid fa-play"></i></button>
    <button class="button button-2"><i class="fa-solid fa-play"></i></button>
    <button class="button button-3"><i class="fa-solid fa-phone-volume"></i></button>

</body>
</html>
