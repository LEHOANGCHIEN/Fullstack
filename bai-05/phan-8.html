<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 14px;
        }

        .box-1 {
            background-color: orange;
            width: 300px;
            height: 400px;
            font-size: 20px;
        }

        .box-2 {
            font-size: 10px;
            background-color: green;
            width: 5rem;
            height: 3rem;
        }
    </style>
    <div class="box-1">
        <div class="box-2"></div>
    </div>
</body>
</html>
